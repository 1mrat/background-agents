<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Greeting App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="greeting-card">
            <div class="time-display" id="timeDisplay"></div>
            <div class="date-display" id="dateDisplay"></div>
            
            <h1 class="greeting-text" id="greetingText">Hello, World!</h1>
            
            <div class="input-section">
                <input 
                    type="text" 
                    id="nameInput" 
                    placeholder="Enter your name..." 
                    class="name-input"
                    maxlength="30"
                >
                <button id="personalizeBtn" class="btn btn-primary">
                    Personalize
                </button>
            </div>
            
            <div class="button-group">
                <button id="randomBtn" class="btn btn-secondary">
                    Random Greeting
                </button>
                <button id="cycleBtn" class="btn btn-secondary">
                    Next Greeting
                </button>
            </div>
            
            <div class="features">
                <h3>Features:</h3>
                <ul>
                    <li>🌍 Multi-language greetings</li>
                    <li>🎲 Random greeting generator</li>
                    <li>👤 Personalized messages</li>
                    <li>🕐 Time-aware greetings</li>
                    <li>✨ Smooth animations</li>
                </ul>
            </div>
        </div>
        
        <div class="background-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>
    
    <script src="hello.js"></script>
    <script src="app.js"></script>
</body>
</html>
